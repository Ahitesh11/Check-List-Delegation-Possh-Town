<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1d4ed8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#brandGrad)" filter="url(#shadow)" />

  <!-- Bold Modern 'P' Letter -->
  <text 
    x="50%" 
    y="54%" 
    text-anchor="middle" 
    dominant-baseline="central" 
    fill="#ffffff" 
    font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
    font-weight="900" 
    font-size="310" 
    letter-spacing="-10">
    P
  </text>

  <!-- Subtle Accent Dot -->
  <circle cx="395" cy="125" r="32" fill="#fb923c" />
</svg>
